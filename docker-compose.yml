services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_HOST: db
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  agent:
    build:
      context: .
      dockerfile: Dockerfile
    # profiles excludes this service from a plain `docker compose up` -
    # restart: "no" alone does NOT do that, it only controls whether Docker
    # restarts the container after it exits, not whether `up` starts it in
    # the first place (verified the hard way: it silently ran during `up`
    # before this was added). Run the agent on demand instead:
    #   docker compose run --rm agent
    #   docker compose run --rm agent python -m scripts.run_agent_task "..."
    profiles:
      - agent
    restart: "no"
    env_file:
      - .env
    environment:
      POSTGRES_HOST: db
    depends_on:
      db:
        condition: service_healthy
    command: ["python", "-m", "scripts.run_agent_task"]

volumes:
  pgdata:
