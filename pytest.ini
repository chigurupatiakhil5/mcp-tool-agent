[pytest]
asyncio_mode = auto
# Without this, "pytest" (bare) can't import app/agent/mcp_server - pytest's
# default rootpath-walking inserts tests/ itself onto sys.path (since
# tests/ has no __init__.py), not the project root. `python -m pytest`
# happens to work anyway because -m always prepends the CWD - which is how
# this went unnoticed locally all project long, until CI ran the bare
# `pytest -v` from the workflow file and failed with ModuleNotFoundError.
pythonpath = .
